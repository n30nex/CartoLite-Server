name: Prepare Firehose dependency lock
on:
  push:
    branches: [codex/firehose-20261024]
    paths: [web/package.json, .github/workflows/firehose-lock.yml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit
        working-directory: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firehose-package-lock
          path: web/package-lock.json
          retention-days: 3
